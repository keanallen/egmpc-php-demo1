services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:1234:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: .
    volumes:
      - ./:/var/www/html:ro

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"

  mysql:
    image: mysql:8.4
    container_name: local-mysql
    ports:
      - "3333:3306"
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: localuser
      MYSQL_PASSWORD: "12345678"
      MYSQL_ROOT_PASSWORD: "1234567890"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:12345:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

volumes:
  mysql_data:
